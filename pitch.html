function App() {
  const [current, setCurrent] = useState(0);
  const [visible, setVisible] = useState(true);
  const [blink, setBlink] = useState(true);
  const [paused, setPaused] = useState(false);
  const [scale, setScale] = React.useState(1);
  const touchStartX = React.useRef(null);

  // Scale the 960px stage to fit any viewport
  React.useEffect(() => {
    const STAGE_W = 960;
    const recalc = () => {
      const vw = window.innerWidth;
      const padding = vw < 600 ? 0 : 40;
      const available = vw - padding;
      setScale(available < STAGE_W ? available / STAGE_W : 1);
    };
    recalc();
    window.addEventListener('resize', recalc);
    return () => window.removeEventListener('resize', recalc);
  }, []);

  useEffect(() => {
    const t = setInterval(() => setBlink(b => !b), 900);
    return () => clearInterval(t);
  }, []);

  useEffect(() => {
    if (paused) return;
    const t = setInterval(() => {
      setVisible(false);
      setTimeout(() => { setCurrent(c => (c + 1) % 5); setVisible(true); }, 400);
    }, 6500);
    return () => clearInterval(t);
  }, [paused]);

  const go = (idx) => { setVisible(false); setTimeout(() => { setCurrent(idx); setVisible(true); }, 300); };
  const change = (dir) => go((current + dir + 5) % 5);
  const togglePause = (e) => { e.stopPropagation(); setPaused(p => !p); };

  // Touch swipe handlers
  const handleTouchStart = (e) => { touchStartX.current = e.touches[0].clientX; };
  const handleTouchEnd = (e) => {
    if (touchStartX.current === null) return;
    const diff = touchStartX.current - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 40) { change(diff > 0 ? 1 : -1); setPaused(true); }
    touchStartX.current = null;
  };

  const gold = "#c8a84b", goldLight = "#e8d08a", teal = "#2a9a9a";
  const paper = "#f5f0e8", muted = "rgba(245,240,232,0.4)", publicColor = "#8a9aaa";
  const mono = { fontFamily: "monospace" };

  const stageStyle = {
    width: "100%", maxWidth: 960, height: 560,
    background: "#0a0d14", border: "1px solid rgba(200,168,75,0.2)",
    borderRadius: 6, position: "relative", overflow: "hidden",
    fontFamily: "Georgia, serif", display: "flex",
    alignItems: "center", justifyContent: "center", margin: "0 auto",
  };
  const gridStyle = {
    position: "absolute", inset: 0,
    backgroundImage: "linear-gradient(rgba(200,168,75,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(200,168,75,0.04) 1px,transparent 1px)",
    backgroundSize: "40px 40px", pointerEvents: "none",
  };
  const fadeStyle = {
    opacity: visible ? 1 : 0,
    transform: visible ? "translateY(0)" : "translateY(12px)",
    transition: "opacity 0.4s ease, transform 0.4s ease",
    width: "100%", height: "100%", display: "flex",
    flexDirection: "column", alignItems: "center", justifyContent: "center",
    padding: "56px 40px 40px", boxSizing: "border-box",
  };

  return (
    <div style={{ background: "#060810", minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: scale < 1 ? "10px 0" : 20 }}>
      <div className="swipe-hint">← swipe to navigate →</div>
      <div className="stage-scaler" style={{ height: 560 * scale }}>
        <div className="stage-scaler-inner" style={{ transform: `scale(${scale})` }}
          onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd}>
      <div style={stageStyle}>
        <div style={gridStyle} />
        <div style={{ position: "absolute", top: 10, left: 16, opacity: 0.9 }}><RelitixLogo size={0.55} /></div>
        <div style={{ position: "absolute", top: 20, right: 22, ...mono, fontSize: 10, letterSpacing: 3, color: "rgba(200,168,75,0.35)" }}>{scenes[current].counter}</div>

        {/* SCENE 2 */}
        {current === 1 && (
          <div style={fadeStyle}>

              ))}

          </div>
        )}

            <div style={{ fontSize: 26, fontWeight: "bold", color: paper, textAlign: "center", marginBottom: 20, lineHeight: 1.1 }}>

                  <div style={{ ...mono, fontSize: 9, letterSpacing: 3, color: "#b080e0", textTransform: "uppercase", marginBottom: 10, borderBottom: "1px solid rgba(150,80,200,0.15)", paddingBottom: 7 }}>🔍 Property Inspection Details</div>
                  {inspectionData.map(d => (
                    <div key={d.category} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
                      <div style={{ flex: 1, ...mono, fontSize: 10, color: "rgba(245,240,232,0.55)" }}>{d.category}</div>
                      <div style={{ width: 60, height: 5, background: "rgba(150,80,200,0.15)", borderRadius: 3, overflow: "hidden" }}>
                        <div style={{ width: `${d.pct * 2}%`, height: "100%", background: d.flag === "High" ? "#c06060" : d.flag === "Medium" ? "#c0a040" : "#60a060", borderRadius: 3 }} />
                      </div>
                      <div style={{ ...mono, fontSize: 9, color: d.flag === "High" ? "#e07070" : d.flag === "Medium" ? "#d4b050" : "#70c080", width: 44 }}>{d.flag}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        )}

        {/* SCENE 4 */}
        {current === 3 && (
          <div style={fadeStyle}>
            <div style={{ ...mono, fontSize: 10, letterSpacing: 4, color: gold, textTransform: "uppercase", marginBottom: 6 }}>Lakehouse + AI Digital Worker Fleet</div>
            <div style={{ fontSize: 32, fontWeight: "bold", color: paper, textAlign: "center", marginBottom: 28 }}>
              Your Data. <span style={{ color: gold }}>Your Advantage.</span>
            </div>
            <div style={{ display: "flex", gap: 28, alignItems: "center" }}>
              <div>
                <div style={{ ...mono, fontSize: 9, color: "rgba(42,154,154,0.6)", letterSpacing: 3, textTransform: "uppercase", marginBottom: 8 }}>AI Workers</div>
                {workers.map(w => (
                  <div key={w.name} style={{ width: 220, padding: "9px 13px", background: "rgba(26,107,107,0.1)", border: "1px solid rgba(42,154,154,0.2)", borderRadius: 4, display: "flex", alignItems: "center", gap: 10, marginBottom: 9 }}>
                    <span style={{ width: 7, height: 7, borderRadius: "50%", background: teal, boxShadow: `0 0 6px ${teal}`, opacity: blink ? 1 : 0.25, transition: "opacity 0.5s", flexShrink: 0, display: "inline-block" }} />
                    <div>
                      <div style={{ ...mono, fontSize: 11, color: teal, fontWeight: "500" }}>{w.name}</div>
                      <div style={{ ...mono, fontSize: 9, color: muted, marginTop: 2 }}>{w.task}</div>
                    </div>
                  </div>
                ))}
              </div>
              <div style={{ width: 160, height: 160, borderRadius: "50%", border: "2px solid rgba(200,168,75,0.4)", background: "radial-gradient(circle,rgba(200,168,75,0.08) 0%,transparent 70%)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", boxShadow: "0 0 40px rgba(200,168,75,0.1)", flexShrink: 0 }}>
                <div style={{ fontSize: 28 }}>🏛️</div>
                <div style={{ fontWeight: "bold", fontSize: 13, letterSpacing: 3, color: gold, marginTop: 4 }}>LAKEHOUSE</div>
                <div style={{ ...mono, fontSize: 9, color: "rgba(200,168,75,0.45)", textAlign: "center", marginTop: 3, letterSpacing: 1 }}>SOVEREIGN<br/>DATA LAYER</div>
              </div>
              <div>
                <div style={{ ...mono, fontSize: 9, color: "rgba(200,168,75,0.6)", letterSpacing: 3, textTransform: "uppercase", marginBottom: 8 }}>Revenue Streams</div>
                {revenues.map(r => (
                  <div key={r.label} style={{ width: 200, padding: "9px 13px", background: "rgba(200,168,75,0.07)", border: "1px solid rgba(200,168,75,0.22)", borderRadius: 4, marginBottom: 9 }}>
                    <div style={{ ...mono, fontSize: 9, color: "rgba(200,168,75,0.55)", textTransform: "uppercase", letterSpacing: 2, marginBottom: 3 }}>{r.label}</div>
                    <div style={{ fontSize: 12, color: goldLight, lineHeight: 1.4 }}>{r.desc}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {/* SCENE 5 */}
        {current === 4 && (
          <div style={{ ...fadeStyle, background: "radial-gradient(ellipse at center,rgba(200,168,75,0.06) 0%,transparent 70%)" }}>
            <div style={{ ...mono, fontSize: 11, letterSpacing: 5, color: gold, textTransform: "uppercase", marginBottom: 18 }}>Relitix · Enterprise Platform</div>
            <div style={{ fontSize: 72, fontWeight: "bold", lineHeight: 0.92, textAlign: "center", color: paper, marginBottom: 24, letterSpacing: 1 }}>
              Own Your Data.<br/><span style={{ color: gold }}>Own Your Future.</span>
            </div>
            <div style={{ fontSize: 17, color: muted, textAlign: "center", maxWidth: 560, lineHeight: 1.65, marginBottom: 36, fontStyle: "italic" }}>
              Every transaction your brokerage closes is a data asset competitors will never have. Relitix ensures you capture it, govern it, and turn it into new revenue — permanently.
            </div>
            <div style={{ display: "flex", gap: 20 }}>
              {[
                { icon: "📄", label: "Contract Review", sub: "AI Extraction Engine" },
                { icon: "🏛️", label: "Lakehouse",       sub: "Sovereign Data Layer" },
                { icon: "🤖", label: "Digital Workers", sub: "AI Fleet Automation"  },
              ].map(p => (
                <div key={p.label} style={{ padding: "12px 24px", border: "1px solid rgba(200,168,75,0.3)", borderRadius: 3, textAlign: "center", background: "rgba(200,168,75,0.04)" }}>
                  <div style={{ fontSize: 20, marginBottom: 6 }}>{p.icon}</div>
                  <div style={{ fontWeight: "bold", fontSize: 14, letterSpacing: 1.5, color: gold }}>{p.label}</div>
                  <div style={{ ...mono, fontSize: 9, color: muted, marginTop: 3, letterSpacing: 1 }}>{p.sub}</div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Progress bar */}
        {!paused && (
          <div style={{ position: "absolute", bottom: 0, left: 0, right: 0, height: 2, background: "rgba(200,168,75,0.08)" }}>
            <div key={`${current}-${paused}`} style={{ height: "100%", background: "rgba(200,168,75,0.5)", animation: "progress 6.5s linear forwards" }} />
          </div>
        )}
        <style>{`@keyframes progress { from { width: 0% } to { width: 100% } }`}</style>

        {/* Nav dots */}
        <div style={{ position: "absolute", bottom: 20, left: "50%", transform: "translateX(-50%)", display: "flex", gap: 8, alignItems: "center" }}>
          {scenes.map((_, i) => (
            <div key={i} onClick={() => go(i)} style={{ width: 8, height: 8, borderRadius: "50%", border: "1px solid rgba(200,168,75,0.4)", background: current === i ? gold : "transparent", cursor: "pointer", transition: "all 0.3s" }} />
          ))}
        </div>

        {/* Pause / Play button */}
        <button onClick={togglePause} style={{ position: "absolute", bottom: 14, left: "50%", transform: "translateX(-50%) translateX(60px)", fontFamily: "monospace", fontSize: 11, letterSpacing: 2, background: paused ? "rgba(200,168,75,0.15)" : "transparent", border: `1px solid rgba(200,168,75,${paused ? "0.7" : "0.35"})`, color: paused ? goldLight : gold, padding: "7px 14px", cursor: "pointer", borderRadius: 2, transition: "all 0.3s", boxShadow: paused ? "0 0 12px rgba(200,168,75,0.2)" : "none" }}>
          {paused ? "▶ PLAY" : "⏸ PAUSE"}
        </button>

        {/* Paused indicator */}
        {paused && (
          <div style={{ position: "absolute", top: 20, left: "50%", transform: "translateX(-50%)", fontFamily: "monospace", fontSize: 9, letterSpacing: 3, color: "rgba(200,168,75,0.5)", textTransform: "uppercase", background: "rgba(200,168,75,0.06)", border: "1px solid rgba(200,168,75,0.2)", padding: "4px 12px", borderRadius: 2 }}>
            ⏸ Paused
          </div>
        )}

        <button onClick={() => change(-1)} className="nav-btn-prev" style={{ position: "absolute", bottom: 14, left: 20, fontFamily: "monospace", fontSize: 10, letterSpacing: 3, background: "transparent", border: "1px solid rgba(200,168,75,0.35)", color: gold, padding: "7px 16px", cursor: "pointer" }}>◀ PREV</button>
        <button onClick={() => change(1)}  className="nav-btn-next" style={{ position: "absolute", bottom: 14, right: 20, fontFamily: "monospace", fontSize: 10, letterSpacing: 3, background: "transparent", border: "1px solid rgba(200,168,75,0.35)", color: gold, padding: "7px 16px", cursor: "pointer" }}>NEXT ▶</button>
      </div>
        </div>{/* /stage-scaler-inner */}
      </div>{/* /stage-scaler */}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
